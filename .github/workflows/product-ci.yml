# Checks for the Flagman product (the product/ folder only).
# The CS395 research files are not built or tested here.
name: Product CI

on:
  push:
    branches: [main]
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"
  pull_request:
    paths:
      - "product/**"
      - ".github/workflows/product-ci.yml"

permissions:
  contents: read

# A new push to the same branch cancels the run that is still going.
concurrency:
  group: product-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Sensor (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: product/core
    steps:
      - uses: actions/checkout@v5
      - name: Install libpcap (needed to build the capture crate)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libpcap-dev
      - name: Install the Rust version pinned in rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: product/core
      - name: Formatting
        run: cargo fmt --check
      - name: Lints (any warning fails)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked
      # `flagmand extract` (machine learning, phase 3) only exists with the
      # `parquet` feature, which is off by default.
      - name: Lints of flagmand extract (parquet feature)
        run: cargo clippy -p flagmand --all-targets --features parquet --locked -- -D warnings
      - name: Tests of flagmand extract, with the byte-identical check
        run: cargo test -p flagmand --features parquet --locked
      - name: The normal flagmand build has no Parquet code (keeps Edge small)
        run: |
          if cargo tree -p flagmand --locked -e normal | grep -q " parquet v"; then
            echo "parquet is in the default flagmand build: keep it behind the parquet feature"
            exit 1
          fi
      # The Python tests (product/ml) read feature files made from the lab
      # captures: they must be exactly what the current code extracts.
      - name: The ML test files match a fresh extraction of the lab captures
        run: |
          for name in lab-attack-chain lab-normal-traffic lab-ssh-logins; do
            cargo run -q --locked -p flagmand --features parquet -- \
              extract "testdata/pcap/$name.pcap" --out "$RUNNER_TEMP/$name.parquet"
            if ! cmp -s "$RUNNER_TEMP/$name.parquet" "../ml/fixtures/$name.parquet"; then
              echo "product/ml/fixtures/$name.parquet is stale: run product/ml/fixtures/make-fixtures.sh and commit the files"
              exit 1
            fi
          done

  ui:
    name: Dashboard (Svelte)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: product/ui
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: product/ui/package-lock.json
      - name: Install exact dependency versions
        run: npm ci
      - name: Type checks (any warning fails)
        run: npm run check
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  ml:
    name: ML pipeline (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: product/ml
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: product/ml/requirements.txt
      - name: Install exact dependency versions
        run: python -m pip install -r requirements.txt
      - name: Tests (small lab files, no download)
        run: python -m pytest
