# CTU-13: the botnet-only capture and the labelled flows of each of the 13
# scenarios. Facts, licence and citation: product/ml/data/README.md.
#
# File names and sizes were read from the folder listings on 2026-11-27
# (sizes are rounded, as the listings show them). No checksums are
# published for these files: the first download records them (--record).
#
# Never downloaded: the malware samples (*.exe.zip) that each scenario folder
# also holds, only-exes-of-ctu-13.zip, and CTU-13-Dataset.tar.bz2 (the
# dataset page says each scenario holds "the original executable file").
#
# Sizes, adding up the listings: about 85 GB in all, of which scenario 51's
# capture is 66G; about 14 GB without it. Leave it out with
#   --skip ctu-51/botnet-capture-20110818-bot.pcap
# unless the team agreed to download it (the script refuses 20 GB or more
# without --allow-large).
dataset = "ctu-13"
page = "https://www.stratosphereips.org/datasets-ctu13"

# Scenario 1 (Neris), folder CTU-Malware-Capture-Botnet-42
[[files]]
name = "ctu-42/botnet-capture-20110810-neris.pcap"
url = "https://mcfp.felk.cvut.cz/publicDatasets/CTU-Malware-Capture-Botnet-42/botnet-capture-20110810-neris.pcap"
listed_size = "56M"
kind = "pcap"
[[files]]
name = "ctu-42/capture20110810.binetflow"
url = "https://mcfp.felk.cvut.cz/publicDatasets/CTU-Malware-Capture-Botnet-42/detailed-bidirectional-flow-labels/capture20110810.binetflow"
listed_size = "369M"
kind = "labels"

