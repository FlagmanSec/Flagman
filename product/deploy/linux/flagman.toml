# Flagman configuration. Installed as /etc/flagman/flagman.toml.
#
# Every key is optional: delete a line and its default (shown here) applies.
# A misspelled key is refused at start-up, with its name in the error.
# After a change: sudo systemctl restart flagman

[capture]
# Interface to watch. Empty: the first interface that is up.
# `flagmand interfaces` lists them.
interface = ""
# See all traffic reaching the network card, not only this machine's.
promiscuous = true
# Kernel capture buffer, in MiB. Raise it if the health strip shows drops.
buffer_mib = 8

[storage]
path = "/var/lib/flagman/flagman.db"
# Flows and traffic counts are deleted after this many days.
flow_retention_days = 7
# Incidents and their alerts are deleted after this many days.
incident_retention_days = 90

[api]
# Keep 127.0.0.1 so only this machine can open the dashboard. To open it
# from another device, prefer an SSH tunnel:
#   ssh -L 8750:127.0.0.1:8750 you@this-machine
listen = "127.0.0.1:8750"
# Created on first start, readable only by the flagman user.
# `sudo flagmand token` prints the dashboard link.
token_file = "/var/lib/flagman/api-token"
# The built dashboard. Empty: serve the API only.
ui_dir = "/usr/share/flagman/ui"

[suricata]
# Read Suricata's alerts if Suricata is installed (it is optional).
enabled = true
eve_path = "/var/log/suricata/eve.json"

[detect]
# Hosts whose behaviour is never reported, for example a router or a
# monitoring server that scans the network on purpose.
ignore_sources = []
# A finding closes after this many quiet seconds.
finding_idle_secs = 120
# A growing finding (a scan in progress) is updated at most this often.
update_every_secs = 5

[detect.port_scan]
window_secs = 60
# Distinct ports one host must try on another within the window.
min_tcp_ports = 20
min_udp_ports = 30

[detect.host_sweep]
window_secs = 60
# Distinct local machines one host must probe within the window.
min_hosts = 15

[detect.brute_force]
window_secs = 60
# New connections to the same login service within the window.
min_attempts = 10
# FTP, SSH, Telnet, POP3, IMAP, SMB, MSSQL, MySQL, RDP, PostgreSQL, VNC
ports = [21, 22, 23, 110, 143, 445, 1433, 3306, 3389, 5432, 5900]

[incidents]
# Alerts from the same host more than this many minutes apart start a new
# incident.
gap_minutes = 30

[flows]
# How long a silent conversation is kept before it is written out.
tcp_idle_secs = 120
udp_idle_secs = 60
other_idle_secs = 30
closed_linger_secs = 5
# Long conversations are written out in pieces of this length.
active_timeout_secs = 300
# Memory guard: conversations tracked at once, at most.
max_flows = 100000
