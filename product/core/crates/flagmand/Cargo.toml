[package]
name = "flagmand"
description = "The Flagman daemon: captures traffic, runs detection, stores results and serves the dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `flagmand extract`: writes the features of every flow to a Parquet file,
# for machine learning (phase 3). Off by default: the sensor never needs
# it, and the router build (Edge) must stay small. Build it with
# `cargo build --release -p flagmand --features parquet`.
parquet = ["dep:flagman-features", "dep:flagman-parquet"]

[dependencies]
flagman-core.workspace = true
flagman-features = { workspace = true, optional = true }
flagman-parquet = { workspace = true, optional = true }
flagman-capture.workspace = true
flagman-store.workspace = true
flagman-suricata.workspace = true
flagman-api.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
ctrlc.workspace = true
getrandom.workspace = true
serde.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile.workspace = true

# Runs the real program twice on the same capture: needs the feature.
[[test]]
name = "extract"
required-features = ["parquet"]
